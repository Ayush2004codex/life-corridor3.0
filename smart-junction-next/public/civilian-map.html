<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Civilian Tracker</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { margin: 0; padding: 0; background: #0a0f1a; font-family: 'Inter', sans-serif; overflow: hidden; }
    #map { width: 100vw; height: 100vh; background: #0a0f1a; }
    .map-overlay {
      position: absolute; top: 16px; left: 16px; right: 16px;
      background: rgba(10,15,26,.9); border: 1px solid rgba(0,200,83,.2);
      border-radius: 12px; padding: 14px; font-size: 13px; backdrop-filter: blur(10px);
      z-index: 1000; color: white; display: flex; flex-direction: column; gap: 8px;
    }
    .row { display: flex; justify-content: space-between; }
    .label { color: #8899b0; }
    .value { color: #00ff66; font-weight: bold; }
    .pulse-dot { display: inline-block; width: 8px; height: 8px; background: #00ff66; border-radius: 50%; box-shadow: 0 0 10px #00ff66; animation: pulse 1.5s infinite; margin-right: 6px; }
    @keyframes pulse { 0% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.5); } 100% { opacity: 1; transform: scale(1); } }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="map-overlay">
    <div class="row"><span class="label" id="statusLabel"><span class="pulse-dot" style="background:#00e5ff; box-shadow:0 0 10px #00e5ff"></span>Approaching</span><span class="value" id="status" style="color:#00e5ff">En Route</span></div>
    <div class="row"><span class="label" id="fromLabel">Dispatched From</span><span class="value" id="fromHosp" style="color:#00e5ff">Hospital</span></div>
    <div class="row"><span class="label">Time to Arrival</span><span class="value" id="eta">Calculating...</span></div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const mapHospitals = {
      "Sagar Dutta Medical College": [22.6896, 88.3712],
      "Barrackpore Sub-Divisional": [22.7578, 88.3688],
      "SSKM Hospital, Kolkata": [22.5398, 88.3444],
      "Apollo Gleneagles": [22.5714, 88.4023],
      "Fortis Hospital": [22.5186, 88.4037]
    };
    const civilianCoord = [22.7303, 88.3703]; // Agarpara

    const map = L.map('map', {zoomControl: false}).setView(civilianCoord, 12);
    L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        attribution: '&copy; OpenStreetMap'
    }).addTo(map);

    // Civilian Marker
    const civIcon = L.divIcon({className: 'civ', html: '<div style="font-size:24px; filter: drop-shadow(0 0 10px rgba(0,229,255,0.8));">🧍</div>', iconSize: [30, 30]});
    L.marker(civilianCoord, {icon: civIcon, zIndexOffset: 500}).addTo(map).bindPopup("Your Location");

    const reqStr = localStorage.getItem('dispatch_request');
    let hospName = "Sagar Dutta Medical College";
    if(reqStr) {
      try { hospName = JSON.parse(reqStr).destination; } catch(e){}
    }
    document.getElementById('fromHosp').textContent = hospName;
    const hospCoord = mapHospitals[hospName] || mapHospitals["Sagar Dutta Medical College"];

    let ambMarker, routeLine, trackingInterval;

    // Phase 1: Hospital TO Civilian
    fetch(`https://router.project-osrm.org/route/v1/driving/${hospCoord[1]},${hospCoord[0]};${civilianCoord[1]},${civilianCoord[0]}?overview=full&geometries=geojson`)
      .then(r => r.json())
      .then(data => {
        let coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
        
        const smoothCoords = [coords[0]];
        for(let i=0; i<coords.length-1; i++) {
          const p1 = coords[i]; const p2 = coords[i+1];
          const dist = map.distance(p1, p2);
          if(dist > 30) {
            const segments = Math.ceil(dist / 30);
            for(let j=1; j<=segments; j++) {
              smoothCoords.push([p1[0] + (p2[0] - p1[0]) * (j/segments), p1[1] + (p2[1] - p1[1]) * (j/segments)]);
            }
          } else smoothCoords.push(p2);
        }
        coords = smoothCoords;
        
        const durationMin = Math.ceil(data.routes[0].duration / 60);
        document.getElementById('eta').textContent = durationMin + ' mins';
        
        routeLine = L.polyline(coords, {color: '#00e5ff', weight: 6, opacity: 0.6, dashArray: '10, 10'}).addTo(map);
        map.fitBounds(routeLine.getBounds(), {padding: [30, 30]});
        
        const ambIcon = L.divIcon({className: 'amb', html: '<div style="font-size:24px; filter: drop-shadow(0 0 10px #00e5ff);">🚑</div>', iconSize: [30, 30]});
        ambMarker = L.marker(coords[0], {icon: ambIcon, zIndexOffset: 1000}).addTo(map);
        
        let progress = 0;
        trackingInterval = setInterval(() => {
          if(progress >= coords.length - 1) {
            clearInterval(trackingInterval);
            document.getElementById('status').textContent = 'Patient Boarding...';
            document.getElementById('eta').textContent = '0 mins';
            setTimeout(() => { startPhase2(); }, 3000);
            return;
          }
          progress += 0.5; if(progress >= coords.length) progress = coords.length - 1;
          ambMarker.setLatLng(coords[Math.floor(progress)]);
        }, 30);
      })
      .catch(err => console.error("OSRM Error Phase 1:", err));

    function startPhase2() {
      if(routeLine) map.removeLayer(routeLine);
      
      document.getElementById('statusLabel').innerHTML = '<span class="pulse-dot" style="background:#00ff66; box-shadow:0 0 10px #00ff66"></span>Transporting to';
      document.getElementById('status').textContent = hospName;
      document.getElementById('status').style.color = '#00ff66';
      document.getElementById('fromLabel').textContent = 'Corridor Status';
      document.getElementById('fromHosp').textContent = '🟢 GREEN CORRIDOR ACTIVE';
      document.getElementById('fromHosp').style.color = '#00ff66';
      
      fetch(`https://router.project-osrm.org/route/v1/driving/${civilianCoord[1]},${civilianCoord[0]};${hospCoord[1]},${hospCoord[0]}?overview=full&geometries=geojson`)
        .then(r => r.json())
        .then(data => {
          let coords = data.routes[0].geometry.coordinates.map(c => [c[1], c[0]]);
          
          const smoothCoords = [coords[0]];
          for(let i=0; i<coords.length-1; i++) {
            const p1 = coords[i]; const p2 = coords[i+1];
            const dist = map.distance(p1, p2);
            if(dist > 30) {
              const segments = Math.ceil(dist / 30);
              for(let j=1; j<=segments; j++) {
                smoothCoords.push([p1[0] + (p2[0] - p1[0]) * (j/segments), p1[1] + (p2[1] - p1[1]) * (j/segments)]);
              }
            } else smoothCoords.push(p2);
          }
          coords = smoothCoords;
          
          const durationMin = Math.ceil(data.routes[0].duration / 60);
          document.getElementById('eta').textContent = durationMin + ' mins';
          
          routeLine = L.polyline(coords, {color: '#00ff66', weight: 6, opacity: 0.8}).addTo(map);
          map.fitBounds(routeLine.getBounds(), {padding: [30, 30]});
          
          const ambIcon = L.divIcon({className: 'amb', html: '<div style="font-size:24px; filter: drop-shadow(0 0 10px #00ff66);">🚑</div>', iconSize: [30, 30]});
          ambMarker.setIcon(ambIcon);
          
          let progress = 0;
          trackingInterval = setInterval(() => {
            if(progress >= coords.length - 1) {
              clearInterval(trackingInterval);
              document.getElementById('status').textContent = 'Arrived at Hospital';
              document.getElementById('eta').textContent = '0 mins';
              return;
            }
            progress += 0.5; if(progress >= coords.length) progress = coords.length - 1;
            ambMarker.setLatLng(coords[Math.floor(progress)]);
          }, 30);
        })
        .catch(err => console.error("OSRM Error Phase 2:", err));
    }
  </script>
</body>
</html>
